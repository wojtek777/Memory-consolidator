<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Chat</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    /* Minimal inline style fallback if needed */
    body { font-family: sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
    .dark { background: #222; color: #f5f5f5; }
    .chat-container { width: 500px; margin: 50px auto; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
    .chat-header { background: #eee; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
    .chat-box { flex: 1; padding: 10px; overflow-y: auto; min-height: 300px; }
    .chat-input { display: flex; padding: 10px; border-top: 1px solid #ccc; }
    .chat-input input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .chat-input button { margin-left: 5px; padding: 8px 12px; border: none; background: #007bff; color: white; border-radius: 4px; cursor: pointer; }
    .message { margin-bottom: 10px; padding: 5px 10px; border-radius: 5px; max-width: 80%; }
    .message.user { background: #d1e7dd; align-self: flex-end; }
    .message.assistant { background: #f8d7da; align-self: flex-start; }
    .timestamp { font-size: 0.7em; color: #666; text-align: right; }
    .typing { font-style: italic; margin: 5px 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <h2>AI Chat</h2>
      <div>
        <button id="theme-toggle">🌙</button>
        <button id="end-chat">End Chat</button>
      </div>
    </header>

    <div id="chat-box" class="chat-box"></div>

    <div id="typing-indicator" class="typing hidden">
      AI is typing<span>.</span><span>.</span><span>.</span>
    </div>

    <div class="chat-input">
      <input id="message" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script src="/static/js/chat.js"></script>
</body>
</html>
